
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess The Number</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #100b25, #211044, #32145b);
            padding: 20px;
        }

        .number {
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            text-align: center;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(15px);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            color: white;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #b9acd6;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .range {
            display: inline-block;
            color: #d5b8ff;
            background: rgba(166, 104, 255, 0.15);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 13px;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 17px;
            border: 2px solid #594078;
            outline: none;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.07);
            color: white;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            transition: 0.3s;
        }

        input:focus {
            border-color: #b47aff;
            box-shadow: 0 0 15px rgba(180, 122, 255, 0.3);
        }

        input::placeholder {
            color: #8e7da9;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 20px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #a855f7, #7138e8);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(139, 72, 245, 0.3);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(139, 72, 245, 0.5);
        }

        button:active {
            transform: scale(0.97);
        }

        #MSG {
            display: block;
            min-height: 50px;
            margin-top: 25px;
            color: #d8c6ff;
            font-size: 14px;
            font-weight: 500;
        }

        .attempts {
            color: #a99bbf;
            font-size: 13px;
            margin-top: 10px;
        }

        .attempts span {
            color: #d9b6ff;
            font-weight: 700;
        }

        .restart {
            background: transparent;
            border: 1px solid #7955a5;
            box-shadow: none;
            margin-top: 12px;
        }

        .restart:hover {
            background: rgba(255,255,255,0.08);
            box-shadow: none;
        }

    </style>
</head>

<body>

    <div class="number">

        <div class="icon">🎯</div>

        <h1>Guess The Number</h1>

        <p class="subtitle">
            Test your luck and find the hidden number!
        </p>

        <div class="range">
            ✨ Choose a number between 1 - 10
        </div>

        <input
            type="number"
            id="Number"
            placeholder="Enter your guess"
            min="1"
            max="10"
            step="1"
        >

        <button onclick="Guess()">Guess Number 🚀</button>

        <span id="MSG" aria-live="polite">
            Your result will appear here...
        </span>

        <p class="attempts">
            Attempts: <span id="count">0</span>
        </p>

        <button class="restart" onclick="Restart()">
            ↻ Restart Game
        </button>

    </div>

    <script>

        // Generate random number between 1 and 10
        let randomNumber = Math.floor(Math.random() * 10) + 1;

        let count = 0;
        let gameOver = false;

        function Guess() {

            if (gameOver) return;

            let input = document.getElementById('Number');
            let YourGuess = Number(input.value);

            let result = document.getElementById('MSG');

            // Input validation
            if (
                input.value.trim() === "" ||
                !Number.isInteger(YourGuess) ||
                YourGuess < 1 ||
                YourGuess > 10
            ) {
                result.innerText = "⚠️ Please enter a whole number between 1-10";
                return;
            }

            // Increase attempts
            count++;

            document.getElementById('count').innerText = count;

            // Check guess
            if (YourGuess > randomNumber) {

                result.innerText = "📈 Too High! Try a smaller number.";

            }
            else if (YourGuess < randomNumber) {

                result.innerText = "📉 Too Low! Try a bigger number.";

            }
            else {

                result.innerText =
                    `🎉 Congratulations! You won in ${count} attempts!`;

                gameOver = true;
            }

            // Clear input
            input.value = "";
            input.focus();

        }

        // Enter key support
        document.getElementById('Number').addEventListener('keydown', function(event) {

            if (event.key === "Enter") {
                Guess();
            }

        });

        // Restart game
        function Restart() {

            randomNumber = Math.floor(Math.random() * 10) + 1;

            count = 0;
            gameOver = false;

            document.getElementById('count').innerText = 0;

            document.getElementById('MSG').innerText =
                "Your result will appear here...";

            document.getElementById('Number').value = "";

            document.getElementById('Number').focus();

        }

    </script>

</body>
</html>
