
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess The Number</title>
</head>
<body>

    <div class="number">
        Guess The Number:
        <input type="number" id="Number" min="1" max="10">

        <br><br>

        <span id="MSG"></span>

        <br><br>

        <button onclick="Guess()">Guess</button>
    </div>

    <script>
        let randomNumber = Math.floor(Math.random() * 10) + 1;

        console.log(randomNumber);

        let count = 0;

        function Guess() {

            let YourGuess = Number(
                document.getElementById('Number').value
            );

            let result = document.getElementById('MSG');

            if (YourGuess < 1 || YourGuess > 10 ||
                document.getElementById('Number').value === "") {

                result.innerHTML = "Please Choose Between 1-10";
                return;
            }

            count++;

            if (YourGuess > randomNumber) {

                result.innerHTML =
                    "Your Guess is Greater Than Number";

            }
            else if (YourGuess < randomNumber) {

                result.innerHTML =
                    "Your Guess is Smaller Than Number";

            }
            else {

                result.innerHTML =
                    `You Are Correct! You guessed in ${count} attempts.`;

            }
        }
    </script>

</body>
</html>
