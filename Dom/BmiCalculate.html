<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="bmi" style="padding: 20px 20px 20px 20px;">
   <input type="text" id="weight" placeholder="Enter weight in kg">

<input type="text" id="height" placeholder="Enter height in cm"> <br>
<span id="result"></span>
<button onclick="calculateBMI()" style="margin-top: 10px;">Calculate BMI</button>
    </div>

</body>
<script>

function calculateBMI() {
    let weight = document.getElementById("weight").value;
    let height = document.getElementById("height").value;

    let result=document.getElementById("result")

    if (weight===''|| weight <= 0 || isNaN(weight)) {

        result.innerHTML="enter valid inputs";
          return;
    }
    
    if (height===''|| height <= 0 || isNaN(height)) {

        result.innerHTML="enter valid inputs";
          return;
    }

    let bmi =Math.floor((weight * 10000) / (height * height))  ;

    document.getElementById('result').innerText=`  result := ${bmi}`;

    document.appendChild;

    console.log("BMI:", bmi.toFixed(2));
}
</script>
</html>
